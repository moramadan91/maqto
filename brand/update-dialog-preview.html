<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqto Updates dialog preview</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0e0f11;
  --text: #e6e6e8;
  --glass: #16171a;
  --glass-hi: #212226;
  --well: #0a0a0c;
  --stroke: #2a2b30;
  --dim: #9b9ca3;
  --accent: #5cd3c6;
  --accent-ink: #0b1f1d;
  --success: #46a758;
  --r: 6px;
  --control-r: 4px;
  --hover: #2a2b30;
  --pressed: #303137;
}
body { margin: 0; color: var(--text); background: var(--bg); font: 12.5px/1.4 Cairo, system-ui, sans-serif; }
main { max-width: 1000px; margin-inline: auto; padding: 32px 0 48px; }
h1 { margin: 0 4vw 24px; font-size: 24px; }
.review-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); justify-items: center; align-items: start; gap: 20px; }
.review-row + .review-row { margin-block-start: 24px; }
.review-case { min-width: 0; }
.review-case h2 { margin: 0 0 8px; color: var(--dim); font-size: 12px; font-weight: 600; }
@media (max-width: 979px) { .review-row { grid-template-columns: minmax(0, 1fr); } }

/* Dialog styles from src/style.css. The symbol is embedded for offline review. */
* { box-sizing: border-box; }
button, select, input, textarea { font: inherit; color: inherit; }
svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.glass { background: var(--glass); border: 1px solid var(--stroke); border-radius: var(--r); }
button { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; background: var(--glass-hi); border: 1px solid var(--stroke); border-radius: var(--control-r); padding: 0 10px; cursor: pointer; }
button:hover { background: var(--hover); }
button:active { background: var(--pressed); }
button:disabled { opacity: .35; cursor: default; }
.box { width: 380px; max-width: 92vw; box-sizing: border-box; padding: 20px; display: grid; gap: 12px; }
.box h3 { margin: 0; font-size: 15px; }
@keyframes spin { to { transform: rotate(360deg); } }
.box:has(.upd-dialog) { width: min(460px, 92vw); max-height: 92vh; overflow: auto; }
.upd-dialog { display: grid; gap: 16px; min-width: 0; overflow-wrap: anywhere; }
.upd-dialog :is(p, h4) { margin: 0; }
.upd-dialog button { min-width: 0; min-height: 32px; justify-content: center; line-height: 1.4; }
.upd-dialog :is(button, .upd-notes-copy):focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.upd-head { display: grid; grid-template-columns: 36px minmax(0, 1fr) fit-content(38%); align-items: center; gap: 10px; }
.box .upd-head h3 { font-size: 19px; line-height: 1.2; }
.upd-mark {
  width: 36px; height: 36px; background: var(--accent);
  mask: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%22234%20213%20373%2093%22%3E%3Cg%3E%3Cpolygon%20points%3D%22286.43%20303.37%20303.09%20277.23%20342.17%20215.53%20291.79%20215.49%20259.81%20266.04%20236.1%20303.36%20286.43%20303.37%22%2F%3E%3Cpath%20d%3D%22M432.36%2C232.63l-25.11%2C39.54-19.66%2C31.2h217.01s.75%2C0%2C.75%2C0c.09%2C0%2C.09-.2%2C0-.22l-.63-.09-2.84-.39-41.24-5.92-83.41-11.98-13.3-2.01%2C10.23-16.35%2C15.16-23.81%2C17.16-27.09h-124.68s-11.37%2C10.05-11.37%2C10.05l-35.06%2C31.23-19.18%2C30.35-10.43%2C16.23h46.84s10.9-9.49%2C10.9-9.49l20.42-18.27%2C18.6-16.44%2C29.85-26.55Z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") center / contain no-repeat;
}
.upd-pill {
  border: 1px solid var(--stroke); border-radius: 999px; padding: 3px 8px;
  background: var(--well); color: var(--dim); font: 11px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
}
.upd-hero {
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 14px;
  background: var(--glass-hi); border: 1px solid var(--stroke); border-radius: calc(var(--control-r) + 4px);
}
.upd-extras { display: contents; }
.upd-hero[data-state="new"] {
  background: color-mix(in srgb, var(--accent) 8%, var(--glass));
  border-color: color-mix(in srgb, var(--accent) 45%, var(--stroke));
}
.upd-summary { display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: center; gap: 12px; }
.upd-summary h4 { color: inherit; font-size: 14px; font-weight: 700; line-height: 1.4; }
.upd-hero[data-state="new"] h4 { color: var(--accent); font-size: 12px; }
.upd-icon {
  display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
  background: var(--well); color: var(--dim);
}
.upd-icon svg.ic { width: 20px; height: 20px; }
.upd-hero:is([data-state="latest"], [data-state="ready"]) .upd-icon { color: var(--success); }
.upd-hero:is([data-state="new"], [data-state="downloading"], [data-state="warning"]) .upd-icon { color: var(--accent); }
.upd-hero[data-state="checking"] .upd-icon svg, .upd-spinning svg { animation: spin 1s linear infinite; }
.upd-detail { color: var(--dim); font-size: 12px; line-height: 1.5; }
.upd-summary .upd-detail { margin-block-start: 2px; }
.upd-summary h4 .upd-detail { font-weight: 400; }
.upd-version { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; font-size: 19px; line-height: 1.35; }
.upd-version > bdi, .upd-arrow { color: var(--dim); }
.upd-arrow { display: grid; place-items: center; }
.upd-arrow:dir(rtl) { transform: scaleX(-1); }
.upd-arrow svg.ic { width: 15px; height: 15px; }
.upd-notes { border-block-start: 1px solid var(--stroke); padding-block-start: 8px; }
.upd-notes-copy {
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
  white-space: pre-wrap; color: var(--dim); font-size: 12px; line-height: 1.5;
}
.upd-notes-copy.upd-expanded { display: block; max-block-size: 9em; overflow: auto; }
.upd-notes .upd-text { min-height: 26px; padding-inline: 0; color: var(--accent); }
.upd-dialog .upd-action { width: 100%; min-height: 36px; font-weight: 700; }
.upd-dialog .upd-primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.upd-dialog .upd-primary:hover:enabled { background: color-mix(in srgb, var(--accent) 88%, var(--glass)); }
.upd-track { height: 6px; border-radius: 999px; overflow: hidden; background: var(--well); }
.upd-track i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.upd-track:not([aria-valuenow]) i { width: 25%; animation: upd-indeterminate 1.1s ease-in-out infinite alternate; }
@keyframes upd-indeterminate { to { margin-inline-start: 75%; } }
.upd-mode { display: grid; gap: 6px; }
.upd-segments {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 3px;
  background: var(--well); border: 1px solid var(--stroke); border-radius: calc(var(--control-r) + 3px);
}
.upd-dialog .upd-segments button { min-height: 30px; background: transparent; border-color: transparent; color: var(--dim); }
.upd-dialog .upd-segments button:hover { background: var(--glass); }
.upd-dialog .upd-segments [aria-checked="true"] { background: var(--glass-hi); border-color: var(--stroke); color: inherit; font-weight: 700; }
.upd-footer {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
  border-block-start: 1px solid var(--stroke); padding-block-start: 12px;
}
.upd-links { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-width: 0; }
.upd-footer > button { margin-inline-start: auto; }
.upd-dialog .upd-ghost { background: transparent; }
.upd-ghost span { display: flex; }
.upd-ghost svg.ic { width: 14px; height: 14px; }
.upd-dialog .upd-text { background: transparent; border-color: transparent; }
.upd-dialog .upd-ghost:hover:enabled, .upd-dialog .upd-text:hover { background: var(--glass-hi); }
@media (prefers-reduced-motion: reduce) {
  .upd-hero[data-state="checking"] .upd-icon svg, .upd-spinning svg, .upd-track:not([aria-valuenow]) i { animation: none; }
}
.review-case .box { max-height: none; }
</style>

  const size = t.updDownloadSize.replace('{got}', digits.format(18)).replace('{total}', digits.format(43));
  const busy = state === 'checking' || state === 'downloading';
  const heading = t[title].replace('{v}', '<bdi>1.0.42</bdi>');
  const detail = {
    latest: `<p class="upd-detail">${t.updLast.replace('{time}', `<bdi>${timeDigits.format(12)}:${timeDigits.format(34)}</bdi>`)}</p>`,
    new: `<p class="upd-version"><bdi>1.0.41</bdi><span class="upd-arrow" aria-hidden="true">${icon('arrow-right')}</span><strong><bdi>1.0.42</bdi></strong></p>`,
  };
  const notes = index === 2 ? `<div class="upd-notes"><p id="notes-${id}" dir="auto" class="upd-notes-copy">${t.notes}</p>
    <button class="upd-text" aria-expanded="false" aria-controls="notes-${id}">${t.showMore}</button></div>` : '';
  const track = state === 'downloading' ? `<div class="upd-track" role="progressbar" aria-label="${t.updDownloading}" aria-valuenow="42"
    aria-valuetext="${percent} · ${size}"><i style="width:42%"></i></div>` : '';

  return `<section class="review-case" lang="${lang}" dir="${rtl ? 'rtl' : 'ltr'}">
    <h2>${t.captions[index]}</h2>
    <div class="glass box"><div class="upd-dialog" role="group" aria-labelledby="title-${id}">
      <header class="upd-head"><span class="upd-mark" aria-hidden="true"></span><h3 id="title-${id}">${t.updates}</h3><bdi class="upd-pill">v1.0.41</bdi></header>
      <div class="upd-hero" data-state="${state}">
        <div class="upd-summary">
          <span class="upd-icon" aria-hidden="true">${icon(glyph)}</span>
          <div role="status"><h4>${heading}${track ? ` <bdi class="upd-detail" aria-hidden="true">${percent} · ${size}</bdi>` : ''}</h4>${detail[state] || ''}</div>
        </div>
        <div class="upd-extras">${notes}${track}
        ${action ? `<button class="upd-action${state === 'warning' ? '' : ' upd-primary'}"${track ? ' disabled' : ''}>${t[action]}</button>` : ''}</div>
      </div>
      <div class="upd-mode">
        <div class="upd-segments" role="radiogroup" aria-label="${t.updHow}" aria-describedby="hint-${id}">
          <button role="radio" aria-checked="true" tabindex="0" data-mode="auto">${t.upd_auto}</button>
          <button role="radio" aria-checked="false" tabindex="-1" data-mode="manual">${t.upd_manual}</button>
        </div>
        <p id="hint-${id}" class="upd-detail">${t.upd_autoHint}</p>
      </div>
      <footer class="upd-footer"><div class="upd-links">
        <button class="upd-ghost${state === 'checking' ? ' upd-spinning' : ''}"${busy ? ' disabled' : ''}><span aria-hidden="true">${icon('refresh-cw')}</span>${t.updCheck}</button>
        <button class="upd-text">${t.wnTitle}</button>
      </div><button>${t.close}</button></footer>
    </div></div>
  </section>`;
}

document.querySelector('#review').innerHTML = cases.map((_, index) => `
  <div class="review-row">${preview(index, 'en')}${preview(index, 'ar')}</div>`).join('');

for (const card of document.querySelectorAll('.review-case')) {
  const t = copy[card.lang];
  const toggle = card.querySelector('[aria-expanded]');
  if (toggle) toggle.onclick = () => {
    const expanded = toggle.getAttribute('aria-expanded') === 'false';
    toggle.setAttribute('aria-expanded', expanded);
    const notes = card.querySelector('.upd-notes-copy');
    notes.classList.toggle('upd-expanded', expanded);
    if (expanded && notes.scrollHeight > notes.clientHeight) notes.tabIndex = 0;
    else notes.removeAttribute('tabindex');
    toggle.textContent = expanded ? t.showLess : t.showMore;
  };
  const radios = [...card.querySelectorAll('[role="radio"]')];
  for (const radio of radios) {
    radio.onclick = () => {
      for (const option of radios) {
        option.setAttribute('aria-checked', option === radio);
        option.tabIndex = option === radio ? 0 : -1;
      }
      card.querySelector('.upd-mode p').textContent = t['upd_' + radio.dataset.mode + 'Hint'];
    };
    radio.onkeydown = event => {
      if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(event.key)) return;
      event.preventDefault();
      const next = radios.find(option => option !== radio);
      next.click();
      next.focus();
    };
  }
}
</script>
</body>
</html>
