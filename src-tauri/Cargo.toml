[package]
name = "maqto"
version = "1.0.39"
description = "Maqto video editor"
edition = "2021"

[lib]
name = "maqto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
fontdb = "0.23"
ort = "2.0.0-rc.15"

# auto-update exists only on desktop
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# saving exports to Photos on iOS
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSLocale", "NSOperation", "NSArray", "NSError", "NSSet", "NSIndexSet"] }
objc2-speech = "0.3"
objc2-vision = "0.3"
objc2-core-video = "0.3"
objc2-core-foundation = "0.3"
whisper-rs = { version = "0.16", features = ["metal"] } # auto captions: the desktop's whisper model, run on the phone

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
