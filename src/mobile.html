<!doctype html>
<meta charset="utf-8">
<title>ماكتو موبايل</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
@font-face { font-family: Cairo; src: url(fonts/Cairo.ttf); font-weight: 200 1000; }
/* Layout: one phone column; liquid-glass panels float over a slow mint/blue/violet glow, like Maqto desktop.
   Home -> permission -> picker -> editor (preview / controls / timeline / swipe dock) -> export -> saved. */
:root {
  --bg: #07090c; --text: #eef2f6; --dim: rgba(238,242,246,.6); --faint: rgba(238,242,246,.32);
  --glass: rgba(255,255,255,.07); --glass-hi: rgba(255,255,255,.13); --stroke: rgba(255,255,255,.14); --well: rgba(0,0,0,.32);
  --accent: #5cd3c6; --ink: #0b1a18; --danger: #ff8080;
  --video: 62,132,255; --audio: 74,210,110; --voice: 255,186,74; --tx: 168,112,255;
  --f: 'Cairo', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--f); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#app { position: relative; height: 100%; max-width: 440px; margin: 0 auto; overflow: hidden; isolation: isolate; }
/* the glow every glass panel refracts */
.aura { position: absolute; inset: -20%; z-index: -1; pointer-events: none; filter: blur(60px); opacity: .55; }
.aura i { position: absolute; border-radius: 50%; animation: drift 18s ease-in-out infinite alternate; }
.aura i:nth-child(1) { width: 60%; height: 40%; top: 4%; right: 6%; background: #1f8f86; }
.aura i:nth-child(2) { width: 55%; height: 38%; top: 40%; left: 0; background: #2346a8; animation-delay: -6s; }
.aura i:nth-child(3) { width: 45%; height: 30%; bottom: 6%; right: 18%; background: #5b2ea6; animation-delay: -12s; }
@keyframes drift { to { transform: translate(8%, -6%) scale(1.12); } }

.glass { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%); border: 1px solid var(--stroke); box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 12px 32px rgba(0,0,0,.35); }
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; min-height: 56px; box-sizing: border-box; }
.top h2 { margin: 0; font-size: 20px; font-weight: 800; flex: 1; }
.ib { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 14px; color: var(--text); }
.ib:active { background: var(--glass-hi); }
.pill { background: var(--accent); color: var(--ink); font-weight: 800; padding: 8px 18px; border-radius: 999px; font-size: 13.5px; box-shadow: 0 6px 18px rgba(92,211,198,.25); }
.pill:disabled { opacity: .35; }
.ghost { background: var(--glass-hi); border: 1px solid var(--stroke); padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 13px; }
.vs { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 0 16px 110px; scrollbar-width: none; }
.vs::-webkit-scrollbar { display: none; }
h3 { font-size: 14px; margin: 22px 2px 10px; color: var(--dim); font-weight: 700; }
.thumb { background: radial-gradient(circle at 70% 30%, hsl(calc(var(--h) + 180) 70% 70% / .3), transparent 45%), linear-gradient(150deg, hsl(var(--h) 55% 44%), hsl(calc(var(--h) + 40) 60% 15%)); }

/* home */
.logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; flex: 1; }
.lang { background: var(--glass-hi); border: 1px solid var(--stroke); padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 13px; }
.logo .mk { width: 46px; height: 12px; flex: none; }
.hero { border-radius: 26px; padding: 14px; display: grid; grid-template-columns: 1fr 96px; gap: 14px; align-items: center; overflow: hidden; }
.hero small { color: var(--accent); font-weight: 700; font-size: 12px; }
.hero b { display: block; font-size: 21px; line-height: 1.25; margin: 2px 0 6px; text-wrap: balance; }
.hero p { margin: 0; font-size: 12.5px; color: var(--dim); }
.mini { height: 150px; border-radius: 16px; background: var(--well); position: relative; overflow: hidden; border: 1px solid var(--stroke); }
.mini .scn { position: absolute; inset: 6px 6px 44px; border-radius: 9px; animation: scene 6s steps(1) infinite; }
@keyframes scene { 0% { background: linear-gradient(150deg, #2c6fb0, #12263f); } 33% { background: linear-gradient(150deg, #b07a2c, #3a2410); } 66% { background: linear-gradient(150deg, #6a3db0, #1f1240); } }
.mini .cap { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); background: var(--accent); color: var(--ink); font-size: 8px; font-weight: 800; padding: 1px 6px; border-radius: 4px; white-space: nowrap; animation: pop 6s infinite; }
@keyframes pop { 0%, 30% { opacity: 0; transform: translateX(-50%) scale(.6); } 36%, 62% { opacity: 1; transform: translateX(-50%) scale(1); } 68%, 100% { opacity: 0; } }
.mini .strip { position: absolute; left: 6px; right: 6px; bottom: 18px; height: 16px; display: flex; gap: 2px; }
.mini .strip i { flex: 1; border-radius: 3px; }
.mini .strip i:nth-child(1) { background: #2c6fb0; } .mini .strip i:nth-child(2) { background: #b07a2c; } .mini .strip i:nth-child(3) { background: #6a3db0; }
.mini .wav { position: absolute; left: 6px; right: 6px; bottom: 6px; height: 8px; border-radius: 3px; background: repeating-linear-gradient(90deg, rgba(74,210,110,.8) 0 2px, transparent 2px 4px); opacity: .7; }
.mini .ph { position: absolute; bottom: 4px; height: 34px; width: 2px; background: #fff; animation: sweep 6s linear infinite; }
@keyframes sweep { from { left: 6px; } to { left: calc(100% - 8px); } }
.newv { width: 100%; margin-top: 14px; border-radius: 24px; padding: 20px 18px; display: flex; align-items: center; gap: 14px; text-align: start; }
.newv .plus { width: 54px; height: 54px; border-radius: 18px; background: var(--accent); color: var(--ink); display: grid; place-items: center; box-shadow: 0 8px 22px rgba(92,211,198,.35); }
.newv .plus svg { width: 28px; height: 28px; stroke-width: 2.4; }
.newv b { display: block; font-size: 18px; }
.newv span { font-size: 12.5px; color: var(--dim); }
.tgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tgrid button { border-radius: 18px; padding: 14px 6px 11px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; text-align: center; }
.tgrid button svg { color: var(--accent); }
.tgrid button:active, .newv:active { background: var(--glass-hi); }
.recent { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.recent::-webkit-scrollbar { display: none; }
.recent button { flex: none; width: 92px; text-align: start; font-size: 11.5px; }
.recent .thumb { height: 120px; border-radius: 14px; margin-bottom: 5px; border: 1px solid var(--stroke); }

.tabs { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 4px; padding: 5px; border-radius: 999px; z-index: 5; }
.tabs button { display: flex; align-items: center; gap: 6px; padding: 9px 20px; border-radius: 999px; font-weight: 700; font-size: 13px; white-space: nowrap; color: var(--dim); }
.tabs button[aria-selected="true"] { background: var(--glass-hi); color: var(--text); box-shadow: inset 0 1px 0 rgba(255,255,255,.15); }

/* projects */
.plist { display: grid; gap: 10px; }
.prow { display: flex; gap: 8px; align-items: stretch; }
.pdel { width: 50px; flex: none; border-radius: 20px; display: grid; place-items: center; color: #ff7a8a; }
.xh { font-size: 12.5px; color: var(--dim); font-weight: 700; text-align: start; }
.xrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 14px; }
.xrow.two { grid-template-columns: repeat(2, 1fr); }
.xrow button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; border-radius: 14px; background: var(--glass-hi); font-weight: 800; font-size: 14px; border: 2px solid transparent; }
.xrow button small { font-weight: 500; font-size: 10.5px; color: var(--dim); }
.xrow button[aria-pressed="true"] { border-color: var(--accent); }
.xrow button:disabled { opacity: .35; }
.xinfo { font-size: 12px; color: var(--dim); margin: 0 0 12px; text-align: start; line-height: 1.5; }
#xGo { width: 100%; padding: 12px; font-size: 15px; }
.xchk { display: flex; gap: 10px; align-items: flex-start; text-align: start; background: var(--glass-hi); padding: 10px 12px; border-radius: 14px; margin: 0 0 14px; font-size: 13px; font-weight: 700; }
.xchk input { accent-color: var(--accent); width: 18px; height: 18px; margin: 2px 0 0; flex: none; }
.xchk small { display: block; color: var(--dim); font-size: 11.5px; font-weight: 500; margin-top: 3px; }
.pcard { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 20px; text-align: start; width: 100%; }
.pcard .thumb { width: 58px; height: 76px; border-radius: 12px; flex: none; }
.pcard div { flex: 1; min-width: 0; }
.pcard b { display: block; font-size: 15px; }
.pcard span { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.empty { text-align: center; padding: 60px 20px; color: var(--dim); }
.empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }
.fab { position: absolute; left: 18px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 6px; z-index: 5; }

/* modal + sheets */
.veil { position: absolute; inset: 0; background: rgba(4,5,7,.55); z-index: 20; display: grid; place-items: center; padding: 24px; }
.alert { border-radius: 26px; padding: 22px 18px 14px; text-align: center; width: 100%; max-width: 320px; box-sizing: border-box; }
.alert .ic { width: 56px; height: 56px; margin: 0 auto 10px; border-radius: 18px; background: var(--accent); color: var(--ink); display: grid; place-items: center; }
.alert b { display: block; font-size: 16px; margin-bottom: 4px; }
.alert p { margin: 0 0 14px; color: var(--dim); font-size: 13px; }
.alert .opts { display: grid; gap: 8px; }
.alert .opts button { padding: 11px; border-radius: 14px; background: var(--glass-hi); font-weight: 700; }
.alert .opts button.pri { background: var(--accent); color: var(--ink); }
.alert .opts button.no { background: none; color: var(--dim); }

/* picker */
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 999px; margin: 0 16px 10px; }
.seg button { flex: 1; padding: 7px; border-radius: 999px; font-weight: 700; font-size: 13px; color: var(--dim); }
.seg button[aria-selected="true"] { background: var(--glass-hi); color: var(--text); }
.limited { margin: 0 16px 10px; font-size: 12px; color: var(--dim); display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: 14px; }
.limited button { color: var(--accent); font-weight: 700; }
.pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 0 3px 150px; }
.tile { position: relative; aspect-ratio: 3/4; border-radius: 4px; overflow: hidden; }
.tile .d { position: absolute; bottom: 4px; left: 6px; font-size: 11px; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,.7); font-variant-numeric: tabular-nums; }
.tile .live { position: absolute; top: 6px; left: 6px; width: 14px; height: 14px; border: 1.5px solid #fff; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(0,0,0,.2), inset 0 0 0 3.5px #fff; }
.tile .ck { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #fff; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: rgba(0,0,0,.2); }
.tile.on .ck { background: var(--accent); border-color: var(--accent); color: var(--ink); }
.tile.on::after { content: ""; position: absolute; inset: 0; background: rgba(92,211,198,.18); }
.tray { position: absolute; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); border-radius: 22px; padding: 10px; z-index: 4; }
.tray .trow { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-height: 48px; align-items: center; }
.tray .trow::-webkit-scrollbar { display: none; }
.tray .trow .thumb { width: 40px; height: 48px; border-radius: 8px; flex: none; position: relative; }
.tray .trow .thumb button { position: absolute; top: -5px; right: -5px; width: 18px; height: 18px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; }
.tray .trow .thumb button svg { width: 11px; height: 11px; stroke-width: 3; }
.tray .bar { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 12.5px; color: var(--dim); }
.tray .hint0 { font-size: 12.5px; color: var(--dim); }

/* editor */
.etop { display: flex; align-items: center; gap: 8px; padding: 8px 12px; }
.etop .nm { flex: 1; min-width: 0; text-align: center; font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage { flex: 1; min-height: 0; position: relative; }
.frame { position: absolute; top: 4px; bottom: 4px; left: 50%; transform: translateX(-50%); aspect-ratio: var(--ar, 9/16); height: calc(100% - 8px); max-width: calc(100% - 24px); }
.frame canvas { width: 100%; height: 100%; border-radius: 12px; display: block; background: #000; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
html { touch-action: manipulation; } /* an app, not a page: no double-tap or pinch zoom */
.frame { touch-action: none; }
.guide { position: absolute; pointer-events: none; background: #ff3d8b; z-index: 3; }
.guide.v { left: 50%; top: 0; bottom: 0; width: 1.5px; margin-left: -.75px; } .guide.h { top: 50%; left: 0; right: 0; height: 1.5px; margin-top: -.75px; }
.selbox { position: absolute; border: 1.5px solid #fff; border-radius: 4px; box-shadow: 0 0 0 1px rgba(0,0,0,.35); pointer-events: none; z-index: 2; }
.selbox i { position: absolute; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
.selbox [data-h="nw"] { left: 0; top: 0; } .selbox [data-h="ne"] { right: 0; top: 0; margin-right: -7px; } .selbox [data-h="sw"] { left: 0; bottom: 0; margin-bottom: -7px; } .selbox [data-h="se"] { right: 0; bottom: 0; margin: 0 -7px -7px 0; }
.endln { position: absolute; top: 0; height: 100%; width: 1.5px; margin-left: -1px; background: #ff5a5a; pointer-events: none; z-index: 3; opacity: 0; transition: opacity .15s; }
.endln.on { opacity: .9; }
.safe { position: absolute; inset: 0; pointer-events: none; border-radius: 12px; overflow: hidden; }
.safe i { position: absolute; background: repeating-linear-gradient(135deg, rgba(255,128,128,.28) 0 6px, rgba(255,128,128,.12) 6px 12px); border: 1px dashed rgba(255,150,150,.7); }
.safe span { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.6); font-size: 10.5px; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.ctrl { display: flex; align-items: center; padding: 4px 10px; gap: 2px; direction: ltr; }
.ctrl .tc { font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 84px; text-align: center; }
.ctrl .tc b { color: var(--text); }
.ctrl .ib { width: 32px; height: 36px; color: var(--dim); }
.ctrl .ib.on { color: var(--accent); }
.ctrl .ib:disabled { opacity: .3; }
.play { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto; }
.play svg { fill: currentColor; stroke: none; width: 18px; height: 18px; }

.tl { flex: 0 0 auto; position: relative; margin: 0 8px; border-radius: 22px; overflow: hidden; }
.scroll { overflow: auto; max-height: 196px; overscroll-behavior: contain; touch-action: none; scrollbar-width: none; direction: ltr; position: relative; }
.scroll::-webkit-scrollbar { display: none; }
.track { position: relative; }
.ruler { position: absolute; top: 0; left: 0; right: 0; height: 22px; background: rgba(14,17,22,.92); z-index: 3; }
.ruler .mk { position: absolute; top: 13px; width: 8px; height: 8px; margin-left: -4px; background: #ffd36a; border-radius: 2px 2px 4px 4px; }
.ruler span { position: absolute; top: 3px; font-size: 9.5px; color: var(--faint); transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.row { position: absolute; left: 0; right: 0; }
.clip { position: absolute; top: 0; bottom: 0; border-radius: 7px; overflow: hidden; box-sizing: border-box; cursor: pointer; }
.clip.lifted { opacity: .25; }
.clip.off { opacity: .4; }
.clip.v.ov { box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); }
.clip.e { background: rgba(255,92,138,.22); border: 1px solid rgba(255,92,138,.55); }
.ghost { z-index: 8; pointer-events: none; outline: 2px solid var(--accent); box-shadow: 0 10px 24px rgba(0,0,0,.6); transform: scale(1.05); opacity: 1 !important; }
.dropln { position: absolute; left: 0; right: 0; border-radius: 8px; background: rgba(92,211,198,.14); border: 1px solid rgba(92,211,198,.6); pointer-events: none; }
.dropln.new { background: var(--accent); border: 0; border-radius: 1px; }
.clip.sel { outline: 2px solid #fff; outline-offset: 0; z-index: 2; }
.clip.sel::before, .clip.sel::after { content: ""; position: absolute; top: 0; bottom: 0; width: 8px; background: #fff; z-index: 2; }
.clip.sel::before { left: 0; border-radius: 8px 0 0 8px; } .clip.sel::after { right: 0; border-radius: 0 8px 8px 0; }
.clip.v { background-image: repeating-linear-gradient(90deg, transparent 0 calc(var(--pps) - 1px), rgba(0,0,0,.4) calc(var(--pps) - 1px) var(--pps)), radial-gradient(circle at 70% 30%, hsl(calc(var(--h) + 180) 70% 70% / .3), transparent 50%), linear-gradient(120deg, hsl(var(--h) 55% 44%), hsl(calc(var(--h) + 40) 60% 17%)); }
.clip.v .fs { position: absolute; inset: 0; display: flex; overflow: hidden; pointer-events: none; }
.clip.v .fs i { flex: none; width: 40px; height: 100%; background-size: cover; background-position: center; box-shadow: inset -1px 0 rgba(0,0,0,.35); }
.clip.v .du { position: absolute; top: 50%; transform: translateY(-50%); left: 6px; font-size: 9.5px; background: rgba(0,0,0,.5); padding: 0 5px; border-radius: 5px; font-variant-numeric: tabular-nums; }
.clip.v .ph8 { position: absolute; bottom: 4px; left: 6px; width: 14px; height: 12px; }
.clip.a { background: rgba(var(--c), .2); border: 1px solid rgba(var(--c), .45); }
.clip.a svg { position: absolute; inset: 2px 4px; width: calc(100% - 8px); height: calc(100% - 4px); }
.clip.a rect { fill: rgba(var(--c), .85); }
.clip.a span, .clip.t span, .clip.e span { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 10.5px; font-weight: 700; white-space: nowrap; unicode-bidi: plaintext; }
.clip.a span { background: rgba(7,9,12,.6); padding: 0 6px; border-radius: 5px; }
.clip.t { background: rgba(var(--tx), .3); border: 1px solid rgba(var(--tx), .6); }
.clip.t.st { background: rgba(255,186,74,.28); border-color: rgba(255,186,74,.6); }
.addrow { position: absolute; top: 3px; bottom: 3px; display: flex; align-items: center; gap: 4px; padding: 0 12px; border-radius: 8px; background: rgba(255,255,255,.05); font-size: 11.5px; color: var(--dim); white-space: nowrap; }
.addrow svg { width: 14px; height: 14px; }
.tr { position: absolute; width: 18px; height: 18px; margin-left: -9px; top: 50%; margin-top: -9px; border-radius: 6px; background: #fff; color: #000; display: grid; place-items: center; z-index: 3; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
.tr svg { width: 12px; height: 12px; stroke-width: 2.4; }
.tr.set { background: var(--accent); }
.phk { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 46px; height: 34px; padding: 2px 7px 12px; pointer-events: auto; touch-action: none; background: none; border: 0; }
.phk svg { display: block; width: 100%; height: 100%; background: #fff; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,.45); fill: none; stroke: #0b1a18; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; padding: 2px 3px; box-sizing: border-box; }
.phk.on svg { background: var(--accent); }
.tlph { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: #fff; z-index: 4; pointer-events: none; border-radius: 1px; }
.addclip { position: absolute; right: 8px; width: 34px; height: 34px; border-radius: 10px; background: #fff; color: #000; display: grid; place-items: center; z-index: 5; box-shadow: 0 4px 12px rgba(0,0,0,.4); }
.addclip svg { stroke-width: 2.6; }


.dock { display: flex; align-items: center; gap: 2px; margin: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); border-radius: 24px; padding: 6px 4px; }
.dock .back { flex: none; width: 40px; height: 56px; display: grid; place-items: center; border-inline-end: 1px solid var(--stroke); margin-inline-end: 2px; }
.dock .rail { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; flex: 1; }
.dock .rail::-webkit-scrollbar { display: none; }
.dock .rail button { flex: none; width: 64px; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; border-radius: 16px; scroll-snap-align: start; position: relative; }
.dock .rail button:active { background: var(--glass-hi); }
.dock .rail button.danger { color: var(--danger); }

let coached = false;
function coach(n) {
  const c = COACH[n], box = $('#coach');
  if (!c) { box.hidden = true; store.set('maqto-coach', '1'); return; }
  box.hidden = false;
  const a = $('#app').getBoundingClientRect(), r = c.el().getBoundingClientRect(), pad = 6;

  const h = $('#hand'); h.setAttribute('class', 'hand ' + c.hand);
  h.style.left = r.left - a.left + r.width * c.at[0] - 12 + 'px'; h.style.top = r.top - a.top + r.height * c.at[1] - 8 + 'px';
  const tip = $('#tip'), above = r.top - a.top > a.height / 2;
  tip.innerHTML = `<b>${c.b}</b><span>${c.s}</span><small>${n + 1} من ${COACH.length} · دوس في أي حتة</small>`;

}
